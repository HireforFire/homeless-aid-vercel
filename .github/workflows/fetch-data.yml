name: Daily Data Refresh
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch fresh data from Feed America + OpenStreetMap
        run: node scripts/fetch-data.mjs

      - name: Commit and push changes
        run: |
          git config user.name "Aid Finder Bot"
          git config user.email "bot@homeless-aid-finder.app"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes. Nothing to commit."
            exit 0
          fi
          git stash
          git pull --rebase origin main
          git stash pop
          git add -A
          git commit -m "Daily data refresh – updated city resources"
          git push origin main
